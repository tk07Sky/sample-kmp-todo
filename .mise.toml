# このプロジェクトのビルドツールチェーンを固定する。
# `mise install` で導入され、ディレクトリに入ると自動で切り替わる。
#
# バージョンは前方一致ではなく完全一致で指定している。
# "temurin-21" のような書き方だとその時点の最新 21 系に解決されてしまい、
# 環境や時期によってビルドに使われる JDK が変わるため。
#
# 注意: Android SDK は mise の管理対象外。
# 別途 Android Studio か cmdline-tools で導入し、local.properties で場所を指定する。
[tools]
# Kotlin 2.4 / AGP 9 の要件は JDK 17 以上。LTS の 21 を使う
java = "temurin-21.0.12+101.0.LTS"

# AGP 9 の要件は Gradle 9.1 以上
gradle = "9.7.1"

# web/（TypeScript / React 版）のビルドに使う。npm は Node に同梱のものを使う
node = "26.3.0"
